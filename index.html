<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TFT Global Leaderboard</title>
    <style>
        /* Giao diện Dark mode mang phong cách game */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f1923; /* Màu nền tối kiểu Riot */
            color: #ece8e1;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #c8aa6e; /* Màu vàng Gold đặc trưng của LMHT/TFT */
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
        }

        .leaderboard-container {
            width: 100%;
            max-width: 800px;
            background-color: #1e282d;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #2b373d;
        }

        th {
            background-color: #111c22;
            color: #a09b8c;
            text-transform: uppercase;
            font-size: 14px;
        }

        tr:hover {
            background-color: #2b373d;
            transition: 0.3s;
        }

        .rank { font-weight: bold; color: #c8aa6e; }
        .tier { font-weight: bold; }
        .challenger { color: #f2e3e5; text-shadow: 0 0 5px #00e5ff; }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #a09b8c;
        }
        .error {
            text-align: center;
            padding: 20px;
            color: #ff4e50;
        }
    </style>
</head>
<body>

    <h1>Bảng Xếp Hạng TFT (Server VN)</h1>
    
    <div class="leaderboard-container">
        <table>
            <thead>
                <tr>
                    <th>Hạng</th>
                    <th>Người Chơi</th>
                    <th>Bậc</th>
                    <th>LP (Điểm)</th>
                    <th>Tỉ lệ thắng</th>
                </tr>
            </thead>
            <tbody id="leaderboard-body">
                <tr>
                    <td colspan="5" class="loading">Đang tải dữ liệu Đấu Trường Chân Lý...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        // LƯU Ý QUAN TRỌNG: Hãy đổi dòng dưới đây thành Link Cloudflare Worker của BẠN
        // Ví dụ: "https://tft-proxy.ten-cua-ban.workers.dev"
        const CLOUDFLARE_WORKER_URL = "https://tft-proxy.nghiepdt2911.workers.dev"; 

        async function loadRealData() {
            const tbody = document.getElementById('leaderboard-body');
            
            try {
                // Gọi đến Proxy Cloudflare của bạn
                const response = await fetch(CLOUDFLARE_WORKER_URL);
                const data = await response.json();

                // Kiểm tra xem dữ liệu có hợp lệ không (tránh lỗi nếu API Key hết hạn)
                if (!data || !data.entries) {
                    throw new Error("Không tìm thấy dữ liệu người chơi. Có thể API Key đã hết hạn.");
                }

                // Sắp xếp người chơi theo số điểm LP giảm dần
                let players = data.entries.sort((a, b) => b.leaguePoints - a.leaguePoints);

                // Cắt lấy top 15 người đứng đầu cho web hiển thị gọn gàng
                players = players.slice(0, 15);

                tbody.innerHTML = ''; // Xóa chữ Đang tải...

                // Trải dữ liệu ra bảng
                players.forEach((player, index) => {
                    // Tính tỉ lệ thắng: (Thắng / (Thắng + Thua)) * 100
                    const totalGames = player.wins + player.losses;
                    const winRate = ((player.wins / totalGames) * 100).toFixed(1) + "%";

                    const row = `
                        <tr>
                            <td class="rank">#${index + 1}</td>
                            <td><strong>${player.summonerName}</strong></td>
                            <td class="tier challenger">Thách Đấu</td>
                            <td>${player.leaguePoints} LP</td>
                            <td>${winRate} (${player.wins}W - ${player.losses}L)</td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
            } catch (error) {
                // Hiển thị thông báo lỗi ra màn hình nếu có vấn đề
                tbody.innerHTML = `<tr><td colspan="5" class="error">Lỗi tải dữ liệu: ${error.message} <br>(Hãy kiểm tra lại Link Worker hoặc xem API Key Riot đã hết hạn chưa)</td></tr>`;
                console.error("Lỗi chi tiết:", error);
            }
        }

        // Chạy hàm ngay khi vừa tải trang xong
        loadRealData();
    </script>
</body>
</html>
