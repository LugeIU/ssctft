<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Web Của Tôi</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f4f4f9;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <script>
    // 1. Dán đường link Cloudflare Worker của bạn vào đây
    const CLOUDFLARE_WORKER_URL = "https://tft-proxy.nghiepdt2911.workers.dev/"; 

    async function loadRealData() {
        const tbody = document.getElementById('leaderboard-body');
        
        try {
            // Gọi đến Proxy
            const response = await fetch(CLOUDFLARE_WORKER_URL);
            const data = await response.json();

            // API Riot trả về danh sách nằm trong data.entries, nhưng nó không được sắp xếp sẵn
            // Chúng ta cần sắp xếp người chơi theo số điểm LP giảm dần
            let players = data.entries.sort((a, b) => b.leaguePoints - a.leaguePoints);

            // Cắt lấy top 15 người đứng đầu cho web nhẹ nhàng
            players = players.slice(0, 15);

            tbody.innerHTML = ''; // Xóa chữ Đang tải...

            // Render dữ liệu lên bảng
            players.forEach((player, index) => {
                // Tính tỉ lệ thắng: (Thắng / (Thắng + Thua)) * 100
                const totalGames = player.wins + player.losses;
                const winRate = ((player.wins / totalGames) * 100).toFixed(1) + "%";

                const row = `
                    <tr>
                        <td class="rank">#${index + 1}</td>
                        <td><strong>${player.summonerName}</strong></td>
                        <td class="tier challenger">Thách Đấu</td>
                        <td>${player.leaguePoints} LP</td>
                        <td>${winRate} (${player.wins}W - ${player.losses}L)</td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        } catch (error) {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:red;">Lỗi tải dữ liệu. Vui lòng thử lại sau.</td></tr>`;
            console.error(error);
        }
    }

    // Chạy hàm khi mở web
    loadRealData();
</script>
</body>
</html>
